    <clipPath id="dc-clip"><circle cx="150" cy="150" r="136"/></clipPath>
    <!-- Riflesso morbido del vinile lucido: sta sotto le scritte, così non le copre -->
    <linearGradient id="dc-gloss" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dc-depth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.82" stop-color="#0A1F3C" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A1F3C" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <circle cx="150" cy="150" r="136" fill="#FFFFFF"/>
  <circle cx="150" cy="150" r="136" fill="url(#dc-depth)"/>
  <circle cx="150" cy="150" r="124" fill="none" stroke="#2A6DD4" stroke-width="3"/>
  <circle cx="150" cy="150" r="84" fill="#EAF3FF"/>
  <rect x="0" y="0" width="300" height="300" fill="url(#dc-gloss)" clip-path="url(#dc-clip)"/>
  <text fill="#0A1F3C" font-family="Instrument Sans, system-ui, sans-serif" font-weight="700" font-size="17" letter-spacing="2"><textPath href="#dc-ring" textLength="648" lengthAdjust="spacing">QUI RIEMPI LA TUA BORRACCIA · QUI RIEMPI LA TUA BORRACCIA · </textPath></text>
  <use href="#fw-logo" x="88" y="122" width="124" height="29.5" style="--logo-a:#0A1F3C;--logo-b:#2A6DD4"/>
  <rect x="86" y="166" width="128" height="30" rx="15" fill="#0A1F3C"/>
  <text x="150" y="185.6" text-anchor="middle" fill="#FFFFFF" font-family="Instrument Sans, system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="1.6" textLength="100" lengthAdjust="spacingAndGlyphs">ACQUA GRATIS</text>
</svg>
